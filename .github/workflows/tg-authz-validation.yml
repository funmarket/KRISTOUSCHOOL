name: TG-AUTHZ-01 validation

on:
  push:
    branches: ['feat/enroll-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Application and Telegram gateway tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Start isolated local Supabase
        run: bun run db:start
      - name: Rebuild isolated database from migrations
        run: bun run db:reset
      - name: Generate TypeScript types from isolated schema
        run: npx --yes supabase@3.1.0 gen types typescript --local > /tmp/pickup-g3-database.types.ts
      - name: Normalize generated TypeScript whitespace
        run: python3 -c "from pathlib import Path; p=Path('/tmp/pickup-g3-database.types.ts'); p.write_text('\\n'.join(line.rstrip() for line in p.read_text().splitlines())+'\\n')"
      - name: Upload isolated schema types for review
        uses: actions/upload-artifact@v4
        with:
          name: pickup-g3-database-types
          path: /tmp/pickup-g3-database.types.ts
          if-no-files-found: error
      - name: Verify committed types match isolated schema
        run: diff -u src/lib/database.types.ts /tmp/pickup-g3-database.types.ts
      - name: Run PostgreSQL authorization tests
        run: bun run db:test
      - name: Stop isolated local Supabase
        if: always()
        run: bun run db:stop
